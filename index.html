<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chat bot</title>

    <!-- css file link -->
    <link rel="stylesheet" href="./index.css">

    <!-- font awesome icon cdn-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="parent">
        <div class="desc">
            <h1 class="text">
                <!-- Graphic era mini-project -->
                Hello , i'm chatbot. 
                

            </h1>
            <p>
                
                please click on start chat.
            </p>
            <button id="init">START CHAT</button>
        </div>
        <div>
            <img src="D:\Javascript-Chatbot-main\chatbot.png" alt="" class="bot-img">
            <h1 class="sidemsg"> I can help if you're feeling unwell.</h1>
        </div>
    </div>
    <div id="test" style="position: fixed;top: 4rem;right: 8rem;display:none ;">
        <div class="child" id="chatbot">
            <div class="header">
                <div class="h-child">
                    <img src="D:\Javascript-Chatbot-main\chatbot (1).png" alt="avatar" id="avatar">
                    <div>
                        <span class="name">Health-Care Chatbot</span>
                        <br>
                        <span style="color:lawngreen">online</span>
                    </div>
                </div>
                <div>
                    <button class="refBtn"><i class="fa fa-refresh" onclick="initChat()"></i></button>
                </div>
            </div>

            <div id="chat-box">

            </div>
            <div class="footer">
                <span>powered by @shu</span>
            </div>
        </div>
    </div>

    <!-- js file  -->
    <script src="D:\Javascript-Chatbot-main\index.js"></script>
</body>
</html>
